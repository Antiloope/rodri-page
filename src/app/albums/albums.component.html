<div class="div-box">
  {{texts[0][langId]}}
  <div class="album-carousel">
    <owl-carousel-o [options]="mySlideOptions">
      <ng-template carouselSlide *ngFor="let album of _albums;let i = index">
        <div class="item" [routerLink]="['/album', album.id]" routerLinkActive="active">
          <div class="album-container-div">
            <img src="{{album.image}}" class="album-image">
            <img src="assets/play.png" class="play-image">
            <div class="album-title">{{album.title[langId]}}</div>
            <div class="album-subtitle">{{album.subtitle[langId]}}</div>
          </div>
        </div>
      </ng-template>
    </owl-carousel-o>
  </div>
</div>
